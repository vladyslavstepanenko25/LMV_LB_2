<title>Будильник: три інтерфейси</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Концепт: три різні способи задати час будильника в однаковому смартфонному застосунку.
   Палітра: чорнильний синій, синій акцент для дій, нейтралі з холодним відтінком. */
:root{
  --bg:#edf0f6; --surface:#ffffff; --surface2:#f2f4f9; --ink:#16202f; --mut:#5a6779; --line:#d8dfe9;
  --brand:#2d5be3; --brand-ink:#ffffff; --soft:#e2eaff; --ok:#1c7f55; --warn:#b4540a; --off:#c3cad6;
  --f:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1522; --surface:#17223a; --surface2:#1d2a47; --ink:#e9eef7; --mut:#9fb0c7; --line:#2c3c5e;
    --brand:#7fa2ff; --brand-ink:#0b1633; --soft:#263a6b; --ok:#5fd6a0; --warn:#f0a35e; --off:#46557a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1522; --surface:#17223a; --surface2:#1d2a47; --ink:#e9eef7; --mut:#9fb0c7; --line:#2c3c5e;
  --brand:#7fa2ff; --brand-ink:#0b1633; --soft:#263a6b; --ok:#5fd6a0; --warn:#f0a35e; --off:#46557a; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.45;margin:0}
.wrap{max-width:1040px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:24px;margin:0 0 4px;font-weight:600;text-wrap:balance}
.sub{color:var(--mut);margin:0 0 16px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tabs button{font:inherit;font-weight:600;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:42px}
.tabs button[aria-selected=true]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.stage{display:grid;grid-template-columns:360px minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:820px){.stage{grid-template-columns:minmax(0,1fr)} .phonebox{justify-self:center}}
.phonebox{display:flex;flex-direction:column;align-items:center;gap:12px}
.phone{position:relative;width:360px;max-width:100%;height:720px;border:8px solid var(--ink);border-radius:36px;background:var(--surface);overflow:hidden}
.phone .scr{position:absolute;inset:0;display:flex;flex-direction:column}
.link{font:inherit;background:none;border:0;color:var(--brand);font-weight:600;cursor:pointer;padding:8px}
.info{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.info h2{font-size:18px;margin:0 0 8px} .info h3{font-size:14px;margin:16px 0 4px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.info p{margin:0}
.info code{display:block;background:var(--surface2);padding:10px 12px;border-radius:8px;font-size:14px;overflow-x:auto;white-space:nowrap}

/* ---- екрани застосунку ---- */
.bar{display:flex;align-items:center;gap:8px;padding:14px 16px 8px}
.bar h2{margin:0;font-size:22px;font-weight:600;flex:1}
.bar .now{color:var(--mut);font-size:13px}
.ic{width:44px;height:44px;border-radius:50%;border:0;background:var(--surface2);color:var(--ink);font-size:20px;cursor:pointer}
ul.al{list-style:none;margin:8px 0 0;padding:0 16px;display:grid;gap:10px}
.al li{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface2);border-radius:14px;padding:14px 16px}
.al li.new{outline:2px solid var(--brand);background:var(--soft)}
.al .t{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;display:block;line-height:1.1}
.al .d{color:var(--mut);font-size:13px}
.sw{width:50px;height:28px;border-radius:14px;background:var(--off);position:relative;border:0;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--brand)} .sw.on::after{left:25px}
.fab{position:absolute;right:16px;bottom:16px;width:64px;height:64px;border-radius:20px;border:0;background:var(--brand);color:var(--brand-ink);font-size:34px;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.snack{position:absolute;left:12px;right:96px;bottom:20px;background:var(--ink);color:var(--surface);border-radius:12px;padding:12px 14px;font-size:14px}
.edit-body{flex:1;overflow:hidden;display:flex;flex-direction:column}
.timearea{padding:4px 16px 8px;display:flex;flex-direction:column;align-items:center}
.rep{padding:6px 16px}
.rep h3{margin:6px 0 8px;font-size:14px;color:var(--mut);font-weight:600}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button,.chip{font:inherit;font-size:14px;font-weight:600;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);cursor:pointer}
.quick button.on,.chip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.days{display:flex;justify-content:space-between;margin-top:10px}
.days button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.days button.on{background:var(--soft);border-color:var(--brand);color:var(--brand)}
.foot{padding:10px 16px 16px}
.save{width:100%;height:52px;border-radius:14px;border:0;background:var(--brand);color:var(--brand-ink);font:inherit;font-size:17px;font-weight:700;cursor:pointer}

/* ---- варіант 1: колесо ---- */
.wheelwrap{position:relative;display:flex;justify-content:center;align-items:center;gap:6px;padding:10px 0;width:100%}
.band{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:250px;height:48px;background:var(--soft);border-radius:12px}
.wheel{position:relative;z-index:1;width:104px;height:220px;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-mask-image:linear-gradient(transparent,#000 28%,#000 72%,transparent);mask-image:linear-gradient(transparent,#000 28%,#000 72%,transparent)}
.wheel::-webkit-scrollbar{display:none}
.wheel .pad{height:88px}
.wi{height:44px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font-size:24px;color:var(--mut);cursor:pointer;font-variant-numeric:tabular-nums}
.wi.sel{color:var(--ink);font-weight:700;font-size:32px}
.colon{position:relative;z-index:1;font-size:32px;font-weight:700}
/* ---- варіант 2: циферблат ---- */
.dhead{display:flex;align-items:center;gap:8px;margin:4px 0 6px}
.dhead .seg{font:inherit;font-size:44px;font-weight:600;width:92px;height:68px;border-radius:14px;border:0;background:var(--surface2);color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.dhead .seg.on{background:var(--soft);color:var(--brand)}
.dhead .colon{font-size:44px}
.ampm{display:grid;gap:4px;margin-left:6px}
.ampm button{font:inherit;font-weight:700;font-size:14px;width:52px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);cursor:pointer}
.ampm button.on{background:var(--soft);color:var(--brand);border-color:var(--brand)}
svg.dial{touch-action:none;width:236px;height:236px;cursor:pointer}
svg.dial text{font-family:var(--f);font-size:17px;font-weight:500;fill:var(--ink)}
/* ---- варіант 3: швидкий вибір ---- */
.big{font-size:60px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;margin:2px 0 8px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.chip{height:50px;font-size:17px;font-variant-numeric:tabular-nums}
.step{display:flex;align-items:center;gap:6px;width:100%;margin-top:10px}
.step .lab{width:46px;color:var(--mut);font-size:13px;font-weight:600}
.step button{flex:1;height:50px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font:inherit;font-size:16px;font-weight:700;cursor:pointer}
.step .v{width:52px;text-align:center;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.sw::after{transition:none}}
</style>

<div class="wrap">
  <h1>Будильник: три інтерфейси</h1>
  <p class="sub">Один застосунок, одна задача («будильник на 07:25 у будні») і три способи задати час. Пройдіть сценарій у кожному.</p>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="stage">
    <div class="phonebox"><div class="phone" id="phone"></div><button class="link" id="reset" type="button">Почати спочатку</button></div>
    <section class="info" id="info" aria-live="polite"></section>
  </div>
</div>

<script>
const pad=n=>String(n).padStart(2,'0');
const DAYS=['Пн','Вт','Ср','Чт','Пт','Сб','Нд'];
const WD=[0,1,2,3,4],WE=[5,6],ALL=[0,1,2,3,4,5,6];
const same=(a,b)=>a.length===b.length&&a.every(x=>b.includes(x));
const daysText=d=>!d.length?'Один раз':same(d,ALL)?'Щодня':same(d,WD)?'Пн–Пт':same(d,WE)?'Сб, Нд':d.slice().sort().map(i=>DAYS[i]).join(', ');
const NOW={day:3,h:23,m:10}; // демо: четвер, 23:10 (значення за замовчуванням у редакторі = поточний час)
function untilNext(h,m,days){
  const n=NOW.day*1440+NOW.h*60+NOW.m;
  for(let k=0;k<=8;k++){const day=(NOW.day+k)%7,abs=NOW.day*1440+k*1440+h*60+m;
    if((!days.length||days.includes(day))&&abs>n) return abs-n;}
  return null;
}
const fmtLeft=x=>{const h=Math.floor(x/60),m=x%60;return (h?h+' год ':'')+(m?m+' хв':'')};

const VARIANTS=[
 {id:'wheel',name:'1. Колесо прокрутки',
  about:'Години й хвилини задаються двома колесами, які прокручуються свайпом; будь-яке значення можна вибрати торканням по рядку.',
  ctx:'Найкраще, коли час довільний (наприклад, 06:48) і користувач звик до стандартних інтерфейсів смартфона.',
  goms:'MPK MPKP MPK MPKP MPK MPK MPK',total:'20,75 с'},
 {id:'dial',name:'2. Циферблат',
  about:'Час обирається торканням по аналоговому циферблату: спочатку година, потім хвилини; AM/PM перемикається окремою кнопкою.',
  ctx:'Найкраще, коли користувачеві зручна метафора годинника, а час кратний 5 хвилинам (літні люди, діти).',
  goms:'MPK MPK MPK MPK MPK MPK',total:'15,90 с'},
 {id:'quick',name:'3. Швидкий вибір',
  about:'Популярний час обирається однією кнопкою, а точне значення підлаштовується кнопками «−5 / +5 хв» і «−1 / +1 год».',
  ctx:'Найкраще для типового часу підйому (06:00–08:30) і керування однією рукою; для довільних хвилин потрібно більше натискань.',
  goms:'MPK MPK MPK MPK MPK',total:'13,25 с'}
];

function Phone(root,kind){
  const S={screen:'list',alarms:[{t:'06:30',days:WD,label:'Зарядка',on:true},{t:'09:00',days:WE,label:'',on:false}],d:null,added:false,snack:''};
  function newDraft(){return {h:NOW.h,m:NOW.m,days:[]}}
  function listHTML(){
    return `<div class="scr"><div class="bar"><h2>Будильники</h2><span class="now">Чт, ${NOW.h}:${pad(NOW.m)}</span></div>
    <ul class="al">${S.alarms.map((a,i)=>`<li class="${a.isNew?'new':''}"><div><b class="t">${a.t}</b><span class="d">${daysText(a.days)}${a.label?' · '+a.label:''}</span></div><button class="sw ${a.on?'on':''}" data-sw="${i}" aria-label="Увімкнути будильник ${a.t}"></button></li>`).join('')}</ul>
    ${S.snack?`<div class="snack" role="status">${S.snack}</div>`:''}
    <button class="fab" data-act="add" aria-label="Додати будильник">+</button></div>`;
  }
  function editHTML(){
    const d=S.d;
    return `<div class="scr"><div class="bar"><button class="ic" data-act="cancel" aria-label="Назад">←</button><h2>Новий будильник</h2></div>
    <div class="edit-body"><div class="timearea" id="ta"></div>
    <div class="rep"><h3>Повторення</h3><div class="quick">
      <button data-q="wd">Будні</button><button data-q="we">Вихідні</button><button data-q="all">Щодня</button><button data-q="once">Один раз</button></div>
      <div class="days">${DAYS.map((x,i)=>`<button data-day="${i}" aria-label="${x}">${x}</button>`).join('')}</div></div></div>
    <div class="foot"><button class="save" data-act="save">Зберегти</button></div></div>`;
  }
  function paintRep(){
    const d=S.d;
    root.querySelectorAll('[data-q]').forEach(b=>{const m={wd:WD,we:WE,all:ALL,once:[]}[b.dataset.q];b.classList.toggle('on',same(d.days,m))});
    root.querySelectorAll('[data-day]').forEach(b=>b.classList.toggle('on',d.days.includes(+b.dataset.day)));
  }
  /* ---- варіанти введення часу ---- */
  const T={
    wheel(ta){
      ta.innerHTML=`<div class="wheelwrap"><div class="band"></div>
       <div class="wheel" id="wh" role="listbox" aria-label="Години"><div class="pad"></div>${Array.from({length:24},(_,i)=>`<div class="wi" data-i="${i}">${pad(i)}</div>`).join('')}<div class="pad"></div></div>
       <div class="colon">:</div>
       <div class="wheel" id="wm" role="listbox" aria-label="Хвилини"><div class="pad"></div>${Array.from({length:60},(_,i)=>`<div class="wi" data-i="${i}">${pad(i)}</div>`).join('')}<div class="pad"></div></div></div>`;
      const wh=ta.querySelector('#wh'),wm=ta.querySelector('#wm');
      const paint=(w,v)=>w.querySelectorAll('.wi').forEach(e=>e.classList.toggle('sel',+e.dataset.i===v));
      const bind=(w,key)=>{
        let raf=0;
        w.addEventListener('scroll',()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{S.d[key]=Math.max(0,Math.min(key==='h'?23:59,Math.round(w.scrollTop/44)));paint(w,S.d[key])})});
        w.addEventListener('click',e=>{const it=e.target.closest('.wi');if(it)w.scrollTo({top:+it.dataset.i*44,behavior:'smooth'})});
        w.scrollTop=S.d[key]*44;paint(w,S.d[key]);
      };
      bind(wh,'h');bind(wm,'m');
    },
    dial(ta){
      let mode='h';
      const h12=()=>S.d.h%12||12, ap=()=>S.d.h>=12?'PM':'AM';
      const setAP=p=>{S.d.h=(h12()%12)+(p==='PM'?12:0)};
      ta.innerHTML=`<div class="dhead"><button class="seg" data-mode="h" aria-label="Години"></button><span class="colon">:</span><button class="seg" data-mode="m" aria-label="Хвилини"></button>
        <div class="ampm"><button data-ap="AM">AM</button><button data-ap="PM">PM</button></div></div>
        <svg class="dial" viewBox="0 0 260 260" role="img" aria-label="Циферблат"></svg>`;
      const svg=ta.querySelector('svg');
      const pt=(a,r)=>[130+r*Math.sin(a*Math.PI/180),130-r*Math.cos(a*Math.PI/180)];
      function draw(){
        ta.querySelector('[data-mode=h]').textContent=pad(h12());ta.querySelector('[data-mode=m]').textContent=pad(S.d.m);
        ta.querySelectorAll('.seg').forEach(b=>b.classList.toggle('on',b.dataset.mode===mode));
        ta.querySelectorAll('[data-ap]').forEach(b=>b.classList.toggle('on',b.dataset.ap===ap()));
        const labels=Array.from({length:12},(_,i)=>mode==='h'?{v:i+1,a:(i+1)*30}:{v:i*5,a:i*30});
        const val=mode==='h'?h12():S.d.m, ang=mode==='h'?(h12()%12)*30:S.d.m*6, [hx,hy]=pt(ang,98);
        svg.innerHTML=`<circle cx="130" cy="130" r="126" fill="var(--surface2)"/>
          <line x1="130" y1="130" x2="${hx}" y2="${hy}" stroke="var(--brand)" stroke-width="3"/><circle cx="130" cy="130" r="5" fill="var(--brand)"/>
          <circle cx="${hx}" cy="${hy}" r="22" fill="var(--brand)"/>
          ${labels.map(l=>{const [x,y]=pt(l.a,98);return `<text x="${x}" y="${y}" dy=".35em" text-anchor="middle" ${l.v===val?'style="fill:var(--brand-ink)"':''}>${mode==='h'?l.v:pad(l.v)}</text>`}).join('')}
          ${labels.some(l=>l.v===val)?'':`<text x="${hx}" y="${hy}" dy=".35em" text-anchor="middle" style="fill:var(--brand-ink)">${val}</text>`}`;
      }
      let down=false;
      const at=e=>{const r=svg.getBoundingClientRect(),a=(Math.atan2(e.clientX-(r.left+r.width/2),-(e.clientY-(r.top+r.height/2)))*180/Math.PI+360)%360;
        if(mode==='h'){const v=Math.round(a/30)%12||12;S.d.h=(v%12)+(ap()==='PM'?12:0)}else S.d.m=Math.round(a/6)%60;draw()};
      svg.addEventListener('pointerdown',e=>{down=true;svg.setPointerCapture(e.pointerId);at(e)});
      svg.addEventListener('pointermove',e=>{if(down)at(e)});
      svg.addEventListener('pointerup',()=>{if(!down)return;down=false;if(mode==='h'){mode='m';draw()}});
      ta.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
        if(b.dataset.mode){mode=b.dataset.mode;draw()} if(b.dataset.ap){setAP(b.dataset.ap);draw()}});
      draw();
    },
    quick(ta){
      const P=['06:00','06:30','07:00','07:30','08:00','08:30'];
      const set=(h,m)=>{let t=((h*60+m)%1440+1440)%1440;S.d.h=Math.floor(t/60);S.d.m=t%60;draw()};
      ta.innerHTML=`<div class="big" id="bt"></div><div class="chips">${P.map(p=>`<button class="chip" data-p="${p}">${p}</button>`).join('')}</div>
        <div class="step"><span class="lab">Год</span><button data-dh="-1">−1</button><span class="v" id="vh"></span><button data-dh="1">+1</button></div>
        <div class="step"><span class="lab">Хв</span><button data-dm="-5">−5</button><button data-dm="-1">−1</button><span class="v" id="vm"></span><button data-dm="1">+1</button><button data-dm="5">+5</button></div>`;
      function draw(){
        ta.querySelector('#bt').textContent=pad(S.d.h)+':'+pad(S.d.m);ta.querySelector('#vh').textContent=pad(S.d.h);ta.querySelector('#vm').textContent=pad(S.d.m);
        ta.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.p===pad(S.d.h)+':'+pad(S.d.m)));
      }
      ta.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
        if(b.dataset.p){const [h,m]=b.dataset.p.split(':').map(Number);set(h,m)}
        else if(b.dataset.dh)set(S.d.h+ +b.dataset.dh,S.d.m);
        else if(b.dataset.dm){let m=S.d.m+ +b.dataset.dm; if(m<0)m+=60; if(m>59)m-=60; S.d.m=m;draw()}});
      draw();
    }
  };
  function render(){
    root.innerHTML=S.screen==='list'?listHTML():editHTML();
    if(S.screen==='edit'){T[kind](root.querySelector('#ta'));paintRep()}
  }
  root.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.sw!==undefined){const a=S.alarms[+b.dataset.sw];a.on=!a.on;b.classList.toggle('on',a.on);return}
    if(b.dataset.act==='add'){S.d=newDraft();S.screen='edit';S.snack='';S.alarms.forEach(a=>a.isNew=false);render();return}
    if(b.dataset.act==='cancel'){S.screen='list';render();return}
    if(b.dataset.act==='save'){const d=S.d;S.alarms.unshift({t:pad(d.h)+':'+pad(d.m),days:d.days.slice(),label:'',on:true,isNew:true});
      const left=untilNext(d.h,d.m,d.days);S.snack=left!=null?'Спрацює через '+fmtLeft(left):'Будильник збережено';S.screen='list';render();return}
    if(b.dataset.q){S.d.days={wd:WD,we:WE,all:ALL,once:[]}[b.dataset.q].slice();paintRep();return}
    if(b.dataset.day!==undefined){const i=+b.dataset.day,k=S.d.days.indexOf(i);k<0?S.d.days.push(i):S.d.days.splice(k,1);paintRep();return}
  });
  render();
}

let cur=0;
function show(i){
  cur=i;
  document.querySelectorAll('#tabs button').forEach((b,j)=>b.setAttribute('aria-selected',j===i));
  const v=VARIANTS[i];
  const ph=document.getElementById('phone');const fresh=ph.cloneNode(false);ph.replaceWith(fresh);Phone(fresh,v.id);
  document.getElementById('info').innerHTML=`<h2>${v.name}</h2><p>${v.about}</p>
   <h3>Коли доречний</h3><p>${v.ctx}</p>
   <h3>Сценарій і оцінка за GOMS</h3><p>Поточний час 23:10; потрібно задати 07:25 у будні та зберегти. Оператори:</p><code>${v.goms}</code><p style="margin-top:8px"><b>Разом: ${v.total}</b> (M = 1,35 с, P = 1,1 с, K = 0,2 с)</p>`;
}
document.getElementById('tabs').innerHTML=VARIANTS.map((v,i)=>`<button role="tab" type="button" data-t="${i}">${v.name}</button>`).join('');
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(b)show(+b.dataset.t)});
document.getElementById('reset').addEventListener('click',()=>show(cur));
show(0);
</script>
